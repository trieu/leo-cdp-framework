<div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
  <h3 class="font-semibold mb-3">Engagement Summary <span class="text-xs font-normal text-slate-400">(last {{periodDays}} days)</span></h3>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 text-sm">
    <div class="border border-slate-100 rounded-lg p-3"><div class="text-xs text-slate-400">Engagement Score</div><div class="text-lg font-semibold">{{engagementScoreLabel}}</div></div>
    <div class="border border-slate-100 rounded-lg p-3"><div class="text-xs text-slate-400">Total Logins</div><div class="text-lg font-semibold">{{totalLogins}}</div></div>
    <div class="border border-slate-100 rounded-lg p-3"><div class="text-xs text-slate-400">Total Transactions</div><div class="text-lg font-semibold">{{totalTransactions}}</div></div>
    <div class="border border-slate-100 rounded-lg p-3"><div class="text-xs text-slate-400">Total Spent</div><div class="text-lg font-semibold">{{totalSpentLabel}}</div></div>
    <div class="border border-slate-100 rounded-lg p-3"><div class="text-xs text-slate-400">Avg. Transaction</div><div class="text-lg font-semibold">{{avgTransactionLabel}}</div></div>
    <div class="border border-slate-100 rounded-lg p-3"><div class="text-xs text-slate-400">Last Interaction</div><div class="text-lg font-semibold">{{lastInteractionLabel}}</div></div>
  </div>
</div>
