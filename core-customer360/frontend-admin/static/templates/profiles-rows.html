{{#each profiles}}
<tr class="border-t border-slate-100 hover:bg-slate-50 cursor-pointer profile-row" data-id="{{master_profile_id}}">
  <td class="px-4 py-3">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-semibold text-xs">{{initials}}</div>
      <div>
        <div class="font-medium text-slate-800">{{displayName}}</div>
        <div class="text-xs text-slate-400">{{shortId}}</div>
      </div>
    </div>
  </td>
  <td class="px-4 py-3 capitalize">{{domain}}</td>
  <td class="px-4 py-3">{{tierLabel}}</td>
  <td class="px-4 py-3">
    <span class="px-2 py-0.5 rounded-full text-xs font-medium {{lifecycleBadgeClass}}">{{lifecycleLabel}}</span>
  </td>
  <td class="px-4 py-3">
    {{#if churn_risk_tier}}<span class="px-2 py-0.5 rounded-full text-xs font-medium {{churnBadgeClass}}">{{churn_risk_tier}}</span>{{else}}<span class="text-slate-300">—</span>{{/if}}
  </td>
  <td class="px-4 py-3">{{clvLabel}}</td>
  <td class="px-4 py-3">{{engagementLabel}}</td>
  <td class="px-4 py-3 text-slate-500">{{lastActivityLabel}}</td>
  <td class="px-4 py-3 text-right"><span class="text-indigo-600 text-xs font-medium">View &rarr;</span></td>
</tr>
{{/each}}
