<div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5">
  <h3 class="font-semibold mb-1">Profile Overview</h3>
  <p class="text-sm text-slate-500 mb-4">{{personaSummary}}</p>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 text-sm">
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Customer Tier</div><div class="font-medium">{{tierLabel}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Account Status</div><div class="font-medium">{{statusLabel}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Primary Relationship</div><div class="font-medium">{{domainLabel}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Customer Since</div><div class="font-medium">{{customerSinceLabel}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Life Stage</div><div class="font-medium">{{lifecycleLabel}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">KYC Status</div><div class="font-medium capitalize">{{kycStatus}}</div></div>
  </div>
</div>
