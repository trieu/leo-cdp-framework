<div class="bg-white border border-slate-200 rounded-xl shadow-sm p-5 text-center">
  <div class="w-20 h-20 mx-auto rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xl">{{initials}}</div>
  <div class="mt-3 font-semibold text-slate-800">{{displayName}}</div>
  <span class="inline-block mt-1 px-2 py-0.5 rounded-full text-xs font-medium {{statusBadgeClass}}">{{statusLabel}}</span>

  <div class="mt-5 text-left space-y-3 text-sm">
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Persona Name</div><div>{{personaName}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Acquisition Source</div><div>{{acquisitionSource}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">First Seen</div><div>{{firstSeenLabel}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Last Seen</div><div>{{lastSeenLabel}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Domain</div><div class="capitalize">{{domain}}</div></div>
    <div><div class="text-xs text-slate-400 uppercase tracking-wide">Customer Tier</div><div>{{tierLabel}}</div></div>
    <div>
      <div class="text-xs text-slate-400 uppercase tracking-wide">Master Profile ID</div>
      <div class="flex items-center gap-2">
        <span class="font-mono text-xs truncate">{{master_profile_id}}</span>
        <button class="btn-copy-id text-indigo-600 text-xs" data-value="{{master_profile_id}}">copy</button>
      </div>
    </div>
  </div>
</div>
