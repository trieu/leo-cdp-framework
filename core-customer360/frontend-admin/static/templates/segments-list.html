<div class="bg-white border border-slate-200 rounded-xl shadow-sm">
  <div class="p-4 border-b border-slate-200 flex flex-wrap items-center gap-3">
    <h1 class="text-lg font-semibold flex-1">Segments</h1>
    <span class="text-xs text-slate-400">Audience Builder — click a segment to see its matched profiles</span>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="text-left font-medium px-4 py-2">Segment</th>
          <th class="text-left font-medium px-4 py-2">Domain</th>
          <th class="text-left font-medium px-4 py-2">Processed By</th>
          <th class="text-left font-medium px-4 py-2">Members</th>
          <th class="text-left font-medium px-4 py-2">Status</th>
          <th class="text-left font-medium px-4 py-2">Created</th>
          <th class="px-4 py-2"></th>
        </tr>
      </thead>
      <tbody id="segments-tbody"></tbody>
    </table>
  </div>
  <div id="segments-list-loading" class="p-6 flex justify-center"><div class="spinner"></div></div>
  <div id="segments-list-empty" class="hidden p-8 text-center text-sm text-slate-500">No segments defined yet.</div>
  <div class="p-4 border-t border-slate-200 flex items-center justify-between text-sm text-slate-500">
    <span id="segments-count-label"></span>
    <button id="btn-segments-load-more" class="hidden border border-slate-300 rounded-lg px-3 py-1.5 hover:bg-slate-50">Load more</button>
  </div>
</div>
