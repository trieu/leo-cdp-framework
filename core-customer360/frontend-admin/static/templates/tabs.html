<header class="bg-white border-b border-slate-200">
  <div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">C360</div>
      <div>
        <div class="text-base font-semibold leading-tight">Customer 360 Platform</div>
        <div class="text-xs text-slate-500 leading-tight">Unified Customer Profile</div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <label class="text-xs text-slate-500 hidden sm:block">Period</label>
      <select id="period-select" class="text-sm border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
        <option value="30">Last 30 days</option>
        <option value="90" selected>Last 90 days</option>
        <option value="180">Last 180 days</option>
        <option value="365">Last 365 days</option>
      </select>
      <button id="btn-export-pdf" class="text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-3 py-1.5 font-medium">Export PDF</button>
      <button id="btn-settings" title="API connection settings" class="text-sm border border-slate-300 rounded-lg px-3 py-1.5 flex items-center gap-2">
        <span id="api-status-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
        <span>Admin</span>
      </button>
    </div>
  </div>
  <nav class="max-w-[1600px] mx-auto px-4 flex gap-6 text-sm overflow-x-auto">
    <button data-tab="overview" class="tab-btn py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Overview</button>
    <button data-tab="profiles" class="tab-btn py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap active">Profiles</button>
    <button data-tab="segments" class="tab-btn py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Segments</button>
    <button data-tab="journeys" class="tab-btn py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Journeys</button>
    <button data-tab="scoring" class="tab-btn py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Scoring</button>
    <button data-tab="analytics" class="tab-btn py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Analytics</button>
    <button data-tab="datasources" class="tab-btn py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Data Sources</button>
    <button data-tab="admin" class="tab-btn py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Admin</button>
  </nav>
</header>
