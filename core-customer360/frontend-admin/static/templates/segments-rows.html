{{#each segments}}
<tr class="border-t border-slate-100 hover:bg-slate-50 cursor-pointer segment-row" data-id="{{segment_id}}">
  <td class="px-4 py-3">
    <div class="font-medium text-slate-800">{{segment_name}}</div>
    <div class="text-xs text-slate-400">{{segment_tag}}</div>
  </td>
  <td class="px-4 py-3 capitalize">{{domainLabel}}</td>
  <td class="px-4 py-3">
    <span class="px-2 py-0.5 rounded-full text-xs font-medium {{processedByBadgeClass}}">{{processedByLabel}}</span>
  </td>
  <td class="px-4 py-3">{{memberCountLabel}}</td>
  <td class="px-4 py-3">
    <span class="px-2 py-0.5 rounded-full text-xs font-medium {{activeBadgeClass}}">{{activeLabel}}</span>
  </td>
  <td class="px-4 py-3 text-slate-500">{{createdLabel}}</td>
  <td class="px-4 py-3 text-right"><span class="text-indigo-600 text-xs font-medium">View &rarr;</span></td>
</tr>
{{/each}}
