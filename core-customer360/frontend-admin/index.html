<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer 360 Platform</title>

  <!-- Tailwind CSS (CDN, per project requirement) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- jQuery 3 (per project requirement) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Handlebars templates (per project requirement) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jQuery QueryBuilder (per project requirement) -->
  <script src="https://cdn.jsdelivr.net/npm/jQuery-QueryBuilder@3.0.0/dist/js/query-builder.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jQuery-QueryBuilder@3.0.0/dist/css/query-builder.default.min.css">

 <!-- notifications -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js" defer crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- lightbox -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lity/2.4.1/lity.min.js" ></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lity/2.4.1/lity.min.css"  />

  <!-- lscache : emulates memcache functions using HTML5 localStorage -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lscache/1.3.2/lscache.min.js" ></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="static/css/app.css" />
</head>

<body class="h-full text-slate-800 antialiased">
  <div id="app" class="min-h-full flex flex-col">

    <!-- Populated from static/templates/tabs.html by static/js/main.js -->
    <div id="app-header"></div>

    <main class="max-w-[1600px] w-full mx-auto px-4 py-4 flex-1">

      <div id="alert-banner"
        class="hidden mb-4 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm px-4 py-3"></div>

      <!-- Reporting overview dashboard (KPIs + Chart.js charts). Content rendered
         from static/templates/overview-dashboard.html by static/js/overview-view.js -->
      <section id="view-overview" class="hidden">
        <div id="overview-loading" class="p-10 flex justify-center">
          <div class="spinner"></div>
        </div>
        <div id="overview-content"></div>
      </section>

      <!-- Master Profiles list. Shell markup from static/templates/profiles-list.html,
         rows rendered from static/templates/profiles-rows.html by static/js/list-view.js -->
      <section id="view-list"></section>

      <!-- Profile detail dashboard. Content rendered from static/templates/profile-details.html
         (and its card partials) by static/js/profile-detail-view.js -->
      <section id="view-detail" class="hidden">
        <button id="btn-back-to-profiles" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium mb-3">&larr;
          Back to profiles</button>
        <div id="detail-loading" class="p-10 flex justify-center">
          <div class="spinner"></div>
        </div>
        <div id="detail-content"></div>
      </section>

      <!-- Segments (Audience Builder) tab: list + detail sub-views. List shell from
         static/templates/segments-list.html, rows from segments-rows.html, detail
         content from segment-details.html, all rendered by static/js/segments-view.js -->
      <section id="view-segments" class="hidden">
        <div id="segment-view-list"></div>
        <div id="segment-view-detail" class="hidden">
          <button id="btn-back-to-segments" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium mb-3">&larr;
            Back to segments</button>
          <div id="segment-detail-loading" class="p-10 flex justify-center">
            <div class="spinner"></div>
          </div>
          <div id="segment-detail-content"></div>
        </div>
      </section>

      <!-- Populated from static/templates/placeholder.html for nav tabs that aren't implemented -->
      <section id="view-placeholder" class="hidden"></section>
    </main>

    <footer class="border-t border-slate-200 py-3 text-center text-xs text-slate-400">
      Customer 360 Admin &middot; data loaded live from <code id="footer-api-base"></code>
    </footer>
  </div>


  <!-- Settings modal is appended to <body> from static/templates/settings-modal.html by static/js/main.js -->

  <script src="static/js/config.js"></script>
  <script src="static/js/formatters.js"></script>
  <script src="static/js/templates.js"></script>
  <script src="static/js/list-view.js"></script>
  <script src="static/js/profile-detail-view.js"></script>
  <script src="static/js/overview-view.js"></script>
  <script src="static/js/segments-view.js"></script>
  <script src="static/js/main.js"></script>
</body>

</html>
